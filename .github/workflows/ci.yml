name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Committed build matches the sources
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code -- dist plugin/hooks/register.mjs
  install:
    # Installs the package the way users do (from a packed tarball, no dev dependencies) and runs the CLI.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm pack
      - run: npm install -g ./autoroute-0.1.0.tgz
      - run: autoroute setup --no-autostart
        env:
          AUTOROUTE_PORT: "43900"
      - run: autoroute doctor
        env:
          AUTOROUTE_PORT: "43900"
      - run: autoroute stop
        env:
          AUTOROUTE_PORT: "43900"
  install-from-github:
    # The command the README gives users, run against the commit being tested.
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g https://github.com/${{ github.repository }}/archive/${{ github.sha }}.tar.gz
      - run: autoroute setup --no-autostart
        env:
          AUTOROUTE_PORT: "43901"
      - run: autoroute stop
        env:
          AUTOROUTE_PORT: "43901"
